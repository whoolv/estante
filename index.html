<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Estante</title>
  <meta name="description" content="Seus PDFs numa estante: continue de onde parou, com marcadores, sumário, busca e marca-texto.">
  <meta name="theme-color" content="#141414">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Estante">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/estante.css">
  <link rel="stylesheet" href="css/leitor.css">
</head>
<body>
  <main id="app" tabindex="-1"></main>
  <div id="anuncios" class="so-leitor" aria-live="polite"></div>

  <input type="file" id="entrada-pdf" accept="application/pdf,.pdf" multiple hidden>
  <input type="file" id="entrada-backup" accept="application/json,.json" hidden>

  <dialog id="dlg-renomear" aria-labelledby="dlg-renomear-titulo">
    <form method="dialog">
      <h2 id="dlg-renomear-titulo">Renomear livro</h2>
      <label class="campo">
        <span>Nome do livro</span>
        <input type="text" name="nome" required maxlength="200" autocomplete="off">
      </label>
      <div class="acoes-dialogo">
        <button type="button" class="botao" value="cancelar" data-fechar>Cancelar</button>
        <button type="submit" class="botao primario" value="salvar">Salvar nome</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-remover" aria-labelledby="dlg-remover-titulo" aria-describedby="dlg-remover-texto">
    <form method="dialog">
      <h2 id="dlg-remover-titulo">Remover da estante?</h2>
      <p id="dlg-remover-texto"></p>
      <div class="acoes-dialogo">
        <button type="button" class="botao" value="cancelar" data-fechar>Cancelar</button>
        <button type="submit" class="botao perigo" value="remover">Remover da estante</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-importar" aria-labelledby="dlg-importar-titulo">
    <form method="dialog">
      <h2 id="dlg-importar-titulo">Importar marcações</h2>
      <p>Juntar as marcações deste arquivo com as atuais? Nada do que você já tem é apagado.</p>
      <div class="acoes-dialogo">
        <button type="button" class="botao" value="cancelar" data-fechar>Cancelar</button>
        <button type="submit" class="botao primario" value="juntar">Juntar marcações</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
